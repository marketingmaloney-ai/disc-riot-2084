# Build the game and publish it to GitHub Pages on every push to main:
#   https://marketingmaloney-ai.github.io/disc-riot-2084/
# One-time setup by the owner: Settings > Pages > Build and deployment > Source: "GitHub Actions"
# (Pages needs the repo to be public, or a paid GitHub plan for a private repo).
# Optional: Settings > Secrets and variables > Actions > Variables > VITE_NET_URL = the online relay URL.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - run: npm run build
        env:
          VITE_NET_URL: ${{ vars.VITE_NET_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
