<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: 'Russo One'; src: url('../../node_modules/@fontsource/russo-one/files/russo-one-latin-400-normal.woff2'); }
@font-face { font-family: 'Orbitron'; font-weight: 900; src: url('../../node_modules/@fontsource/orbitron/files/orbitron-latin-900-normal.woff2'); }
html, body { margin: 0; background: #12052a; overflow: hidden; }
.c { position: relative; overflow: hidden; background: #12052a; }
.shot { position: absolute; left: 0; width: 100%; }
.cap { position: absolute; left: 0; right: 0; top: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.cap.overlay { background: linear-gradient(rgba(18,5,42,.92), rgba(18,5,42,.7) 70%, transparent); }
.cap.band { background: linear-gradient(90deg, #2a0b52, #12052a 50%, #2a0b52); border-bottom: 4px solid #ff2e9a; box-shadow: 0 0 40px rgba(255,46,154,.6); }
.t { font-family: 'Russo One'; color: #ffe600; text-shadow: .06em .06em 0 #ff2e9a, 0 0 .4em rgba(255,230,0,.5); transform: skewX(-8deg); letter-spacing: .04em; }
.s { font-family: 'Orbitron'; font-weight: 900; color: #19e6ff; letter-spacing: .25em; text-shadow: 0 0 .5em rgba(25,230,255,.7); margin-top: .25em; }
</style></head><body><div id="r"></div><script>
const P = new URLSearchParams(location.search), W = +P.get('w'), H = +P.get('h'), mode = P.get('mode');
const img = P.get('img'), t = P.get('t'), s = P.get('s');
let h;
if (mode === 'overlay' && !t) h = `<div class="c" style="width:${W}px;height:${H}px"><img class="shot" src="${img}" style="top:0;height:100%"></div>`;
else if (mode === 'overlay') h = `<div class="c" style="width:${W}px;height:${H}px"><img class="shot" src="${img}" style="top:0;height:100%"><div class="cap overlay" style="height:${H*0.3}px;padding-bottom:${H*0.04}px"><div class="t" style="font-size:${H*0.085}px">${t}</div><div class="s" style="font-size:${H*0.032}px">${s}</div></div></div>`;
else { const ih = Math.round(W * 1320 / 2868); const band = H - ih; h = `<div class="c" style="width:${W}px;height:${H}px"><img class="shot" src="${img}" style="top:${band}px;height:${ih}px"><div class="cap band" style="height:${band - 4}px"><div class="t" style="font-size:${band*0.36}px">${t}</div><div class="s" style="font-size:${band*0.14}px">${s}</div></div></div>`; }
document.getElementById('r').innerHTML = h;
</script></body></html>
